<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="128" y1="64" x2="896" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17202B"/>
      <stop offset="1" stop-color="#090C12"/>
    </linearGradient>
    <linearGradient id="wave" x1="272" y1="0" x2="752" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36C6A9"/>
      <stop offset="0.52" stop-color="#8A79F5"/>
      <stop offset="1" stop-color="#F18A4B"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dot" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="72" y="72" width="880" height="880" rx="214" fill="url(#bg)"/>
  <rect x="73.5" y="73.5" width="877" height="877" rx="212.5" stroke="white" stroke-opacity=".12" stroke-width="3"/>
  <!-- The call's audio, as a waveform dropping into the archive tray. -->
  <g stroke="url(#wave)" stroke-width="46" stroke-linecap="round" filter="url(#glow)">
    <path d="M272 382V478"/>
    <path d="M352 322V538"/>
    <path d="M432 262V598"/>
    <path d="M512 212V648"/>
    <path d="M592 272V588"/>
    <path d="M672 332V528"/>
    <path d="M752 392V468"/>
  </g>
  <!-- The archive tray, drawn like Token Stats' white corner strokes. -->
  <path d="M236 608V734C236 776 270 810 312 810H712C754 810 788 776 788 734V608" stroke="#E8E8EA" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M424 712H600" stroke="white" stroke-opacity=".28" stroke-width="22" stroke-linecap="round"/>
  <!-- It records on its own, so a small red recording light. -->
  <circle cx="790" cy="236" r="34" fill="#F0584C" filter="url(#dot)"/>
</svg>
